<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Bible — Interactive Frame</title>
<style>
  body {
    margin: 0;
    background: #0a0a0a;
    color: #eee;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #111 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23111" width="100" height="100"/><circle cx="50" cy="50" r="1" fill="%23333"/></svg>') repeat;
  }
  .asset {
    position: absolute;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .asset:hover {
    transform: scale(1.05);
  }
  .lore {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .asset:hover .lore,
  .asset:focus .lore {
    opacity: 1;
  }
  .node-1 { top: 30%; left: 25%; width: 120px; height: 120px; background: radial-gradient(circle, #4a90e2, #1a3a6a); border-radius: 50%; }
  .node-2 { top: 40%; left: 55%; width: 90px; height: 90px; background: radial-gradient(circle, #e24a4a, #6a1a1a); border-radius: 12px; }
  .node-3 { top: 60%; left: 40%; width: 100px; height: 100px; background: radial-gradient(circle, #4ae24a, #1a6a1a); clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
</style>
</head>
<body>
<div class="frame">
  <div class="asset node-1" tabindex="0">
    <div class="lore">Dryad node — organic Matrix node. Hover for full packet.</div>
  </div>
  <div class="asset node-2" tabindex="0">
    <div class="lore">Sonora gold country marker. Hover for location notes.</div>
  </div>
  <div class="asset node-3" tabindex="0">
    <div class="lore">Butt Dialer signal. Hover for chaos packet.</div>
  </div>
</div>
</body>
</html>
